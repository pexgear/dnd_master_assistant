name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run the suite by hand without pushing anything.
  workflow_dispatch:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs these even under the offscreen platform: it still loads the
      # platform plugin, which links against EGL and xkbcommon.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libpulse0

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        env:
          # No display on any runner, and it keeps the run deterministic.
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: pytest -q

  package:
    name: build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build

      # Catches the metadata problems that only surface at upload time, which
      # is a bad moment to discover them.
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
