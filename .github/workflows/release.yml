name: release

# Pushing a v* tag is the whole trigger. Nothing here runs on an ordinary push,
# so cutting a release is a deliberate act and never an accident.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  verify:
    name: check the tag matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tagging v0.3.0 while the package still says 0.1.0 produces a release
      # whose artifacts are named after a different version. Stop here instead.
      - name: Compare the tag with __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('canon_keeper/__init__.py').read_text()).group(1))")
          echo "tag=$TAG code=$CODE"
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::Tag $TAG does not match __version__ $CODE." \
                 "Bump canon_keeper/__init__.py, commit, then retag."
            exit 1
          fi

  test:
    name: ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # Three times the suite's honest length. Past this it is stuck,
    # and a stuck job that runs to GitHub's six-hour ceiling cancels
    # the whole release and says nothing about why.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libpulse0

      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: pytest -q

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag ending in anything but digits (v0.3.0-rc1, v0.3.0-beta) is
          # published as a pre-release, so it does not become the "latest" one.
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Inert until you opt in: set the repository variable PUBLISH_TO_PYPI to
    # "true" once PyPI trusted publishing is configured for this repo.
    if: vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write # trusted publishing, so there is no token to leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
