[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canon-keeper"
# One source of truth: canon_keeper/__init__.py. The release workflow refuses
# to build if the git tag disagrees with it.
dynamic = ["version"]
description = "A dockable desktop assistant for running D&D 5e: characters, cities, and NPC conversation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dnd", "ttrpg", "dungeon-master", "qt", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
  "PySide6>=6.6",
  "platformdirs>=4.0",
  # Saved session passwords go to the OS credential store, never a file.
  "keyring>=25.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/pexgear/dnd_master_assistant"
Issues = "https://github.com/pexgear/dnd_master_assistant/issues"

[project.scripts]
canonkeeper = "canon_keeper.__main__:main"
canonkeeper-server = "canon_keeper.server_main:main"

[project.gui-scripts]
canonkeeper-gui = "canon_keeper.__main__:main"

# First-party panels load through exactly the same entry-point group that
# third-party plugins use. If it breaks for us, it breaks for them.
[project.entry-points."canonkeeper.panels"]
characters = "canon_keeper.panels.characters:CharactersPanel"
cities = "canon_keeper.panels.cities:CitiesPanel"
transcript = "canon_keeper.panels.transcript:TranscriptPanel"
table = "canon_keeper.panels.table:TablePanel"

[tool.hatch.version]
path = "canon_keeper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["canon_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
